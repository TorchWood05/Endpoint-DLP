[package]
name = "argus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["user", "fanotify", "fs"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4", "serde"] }

